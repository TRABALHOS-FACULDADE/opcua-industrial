ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [ com.altuslink.ApplicationKt.module ]
  }
}

plc {
  host = "127.0.0.1"
  host = ${?PLC_HOST}
  port = 4840
  port = ${?PLC_PORT}

  # OPC UA node address prefix — placeholder until Altus PLC node IDs are confirmed
  # Format: ns={namespace};s=  (string identifier)
  # Override with actual node prefix once inspected via UaExpert or similar browser
  nodePrefix = "ns=2;s="
  nodePrefix = ${?PLC_NODE_PREFIX}

  # Authentication — required by the Altus PLC Kit OPC UA server
  username = ""
  username = ${?PLC_USERNAME}
  password = ""
  password = ${?PLC_PASSWORD}

  # Security policy:
  #   NONE             — no TLS (use for simulator / local dev only)
  #   Basic256Sha256   — recommended for hardware
  securityPolicy = "Basic256Sha256"
  securityPolicy = ${?PLC_SECURITY_POLICY}

  # Message security mode (effective only when securityPolicy != NONE):
  #   NONE | SIGN | SIGN_ENCRYPT
  messageSecurity = "SIGN_ENCRYPT"
  messageSecurity = ${?PLC_MESSAGE_SECURITY}

  # Optional client keystore (PKCS12). If omitted, PLC4X auto-generates a self-signed cert.
  # The auto-generated cert must be trusted manually in the PLC server on first connection.
  # keyStoreFile = "certs/client.p12"
  # keyStorePassword = "changeit"

  # Number of physical lamps connected to the PLC (1..lampCount)
  lampCount = 8
  lampCount = ${?PLC_LAMP_COUNT}
}

polling {
  # Interval in milliseconds for the WebSocket lamp state poller
  intervalMs = 1000
  intervalMs = ${?POLLING_INTERVAL_MS}
}
